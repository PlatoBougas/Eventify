<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8ecf2"/>
      <stop offset="100%" style="stop-color:#f0f2f5"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.2" fill="#c8cdd6" opacity="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Main card -->
  <rect x="160" y="95" width="880" height="440" rx="24" fill="url(#card)" stroke="#e2e5ea" stroke-width="1.5" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Logo mark -->
  <rect x="340" y="158" width="56" height="56" rx="14" fill="#2563eb"/>
  <!-- Calendar icon in logo -->
  <rect x="351" y="166" width="34" height="32" rx="5" fill="none" stroke="white" stroke-width="2.2"/>
  <line x1="362" y1="162" x2="362" y2="170" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="374" y1="162" x2="374" y2="170" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="351" y1="178" x2="385" y2="178" stroke="white" stroke-width="2.2"/>
  <line x1="368" y1="186" x2="368" y2="194" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="364" y1="190" x2="372" y2="190" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Eventify wordmark -->
  <text x="412" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#0f1117">Event</text>
  <text x="541" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#2563eb">ify</text>

  <!-- Tagline -->
  <text x="368" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#6b7280" letter-spacing="0.2">AI-powered</text>

  <!-- Divider -->
  <line x1="220" y1="268" x2="980" y2="268" stroke="#e2e5ea" stroke-width="1"/>

  <!-- Headline -->
  <text x="600" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#0f1117" text-anchor="middle" letter-spacing="-0.5">Add any event to your calendar by taking a picture.</text>

  <!-- Subtext -->
  <text x="600" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6b7280" text-anchor="middle">Upload any event image and AI instantly adds it to Google Calendar.</text>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="248" y="416" width="196" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="346" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#2563eb" text-anchor="middle">📸  Take a photo</text>

  <!-- Pill 2 -->
  <rect x="460" y="416" width="280" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="600" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#2563eb" text-anchor="middle">⌘V  Paste screenshot</text>

  <!-- Pill 3 -->
  <rect x="756" y="416" width="196" height="44" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="854" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#2563eb" text-anchor="middle">📅  1-click add</text>
</svg>
